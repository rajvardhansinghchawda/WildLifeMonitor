name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: wildlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Format check (Ruff)
        run: |
          ruff format --check backend/

      - name: Lint check (Ruff)
        run: |
          ruff check backend/

      - name: Type check (Mypy)
        run: |
          mypy backend/app

      - name: Run test suite with PostGIS
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/wildlife_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/wildlife_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          AUTH_MODE: development
        run: |
          cd backend && pytest tests/ -v
